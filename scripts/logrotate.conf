# Logrotate configuration for InsightED ESF7 application logs
/var/www/html/InsightED-ROSDO/insighted-esf7-prod/logs/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 www-data www-data
    sharedscripts
    postrotate
        # Signal PM2 workers to reload log file descriptors
        pm2 reloadLogs > /dev/null 2>&1 || true
    endscript
}
