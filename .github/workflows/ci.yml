name: CI

# Runs the full quality gate on every pull request and on pushes to main.
# To make it mandatory: GitHub > Settings > Branches > Branch protection rule for "main" >
#   "Require status checks to pass before merging" > select "verify" and "e2e".

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: esf7_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/esf7_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - name: Install (root, client, server)
        run: |
          npm ci
          npm ci --prefix client
          npm ci --prefix server
      - name: Lint (warning count may only go down)
        run: npm run lint
      - name: Type check (draft, auto-save, sync, API client)
        run: npm run typecheck
      - name: Unit tests with coverage thresholds
        run: npm run test:coverage
      - name: Backend integration tests (real PostgreSQL + Redis)
        run: npm run test:integration:ci
      - name: Environment format check
        run: npm run check:env
      - name: Build (warnings are errors) and bundle budget
        run: npm run build
      - name: Smoke test of the built output
        run: node scripts/smoke-test.mjs
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - name: Install
        run: |
          npm ci
          npm ci --prefix client
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (built client, fake API)
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
